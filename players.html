<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Players – Football Agency Sierra Leone</title>

  <!-- ======  QUICK COLOUR-BOOST  ====== -->
  <style>
    /* ---------- page background ---------- */
    body{
      background: linear-gradient(135deg, #171817 0%, #080808 100%);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* ---------- keep your old nav look ---------- */
    header{
      background: #000000cc; /* semi-transparent black */
      padding: 20px 0;
      text-align: center;
    }
    nav a{
      color: #ffffff;
      margin: 0 12px;
      text-decoration: none;
      font-weight: 600;
    }
    nav a.active{ color: #90ee90; text-decoration: underline; }

    /* ---------- centre wrapper ---------- */
    .container{
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }
    h1{ color: #ffffff; margin-bottom: 25px; }

    /* ---------- player shelf ---------- */
    .players{
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ---------- individual card ---------- */
    .card{
      background: #111111ee;
      border-radius: 12px;
      width: 220px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,.5);
      transition: transform .3s;
    }
    .card:hover{ transform: translateY(-8px); }

    /* ---------- top colour stripe ---------- */
    .card::before{
      content: "";
      display: block;
      height: 6px;
      border-radius: 12px 12px 0 0;
      margin: -20px -20px 15px -20px;
    }

    /* each card gets its own stripe */
    .card:nth-child(1)::before{ background: #141414; } /* Chelsea blue */
    .card:nth-child(2)::before{ background: #292828; } /* Man-red */
    .card:nth-child(3)::before{ background: #0f0f0f; } /* Arsenal yellow */

    /* ---------- image & text ---------- */
    .card img{
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }
    .card h3{ margin: 12px 0 4px; font-size: 1.3rem; color: #ffffff; }
    .card p{ font-size: 1.1rem; color: #90ee90; font-weight: bold; }

    /* ---------- footer ---------- */
    footer{
      text-align: center;
      padding: 20px;
      font-size: .8rem;
      color: #cccccc;
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="aboutus.html">About</a>
      <a href="players.html">Players</a>
      <a href="matches.html">Match</a>
      <a href="contactus.html">Contact</a>
    </nav>
  </header>

  <div class="container">
    <h1>Our Players</h1>
    <div class="players">
      <div class="card">
        <img src="image/abdulai.jpg" alt="Abdulai Bah">
        <h3>Abdulai Bah</h3>
        <p>13</p>
      </div>

      <div class="card">
        <img src="image/joseph .jpg" alt="Joseph Clement">
        <h3>Joseph Clement</h3>
        <p>10</p>
      </div>

      <div class="card">
        <img src="image/jerry.jpg" alt="Jerry Conteh">
        <h3>Jerry Conteh</h3>
        <p>7</p>
      </div>
    </div>
  </div>

  <footer>Copyright &copy; Football Agency Sierra Leone 2025</footer>
</body>
</html>
